[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-inbox-core"
version = "0.1.0"
description = "Consumer-neutral durable inbox core"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
universal-inbox = "universal_inbox.__main__:main"
universal-inbox-secretary = "universal_inbox.secretary_runtime:main"

[tool.setuptools.packages.find]
where = ["src"]
